name: Deploy Svelte to GitHub Pages

on:
  push:
    branches: [ Default ]  # or your default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # For SvelteKit, the build output is usually under "build" or ".svelte-kit/output"
      # For regular Svelte, it's often "public" or "dist"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist  # Change to "dist" or your build output directory
          
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
